@if (auth.isAuthenticated()) {
  <header class="topbar">
    <a class="brand" routerLink="/catalog" aria-label="Acervo Digital, inicio">
      <span class="brand-mark"><svg [lucideIcon]="icons.LucideBookOpen" aria-hidden="true"></svg></span>
      <span>acervo<span class="brand-dot">.</span></span>
    </a>
    <nav class="primary-nav" aria-label="Navegación principal">
      <a routerLink="/catalog" routerLinkActive="is-active"><svg [lucideIcon]="icons.LucideLibrary" aria-hidden="true"></svg> Catálogo</a>
      <a routerLink="/collections" routerLinkActive="is-active"><svg [lucideIcon]="icons.LucideBoxes" aria-hidden="true"></svg> Colecciones</a>
      <a routerLink="/types" routerLinkActive="is-active"><svg [lucideIcon]="icons.LucideSlidersHorizontal" aria-hidden="true"></svg> Tipos y atributos</a>
    </nav>
    <div class="account-menu">
      <span class="account-email">{{ auth.email() }}</span>
      <button class="icon-button" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" (click)="logout()">
        <svg [lucideIcon]="icons.LucideLogOut" aria-hidden="true"></svg>
      </button>
    </div>
  </header>
  <main class="workspace"><router-outlet /></main>
} @else {
  <router-outlet />
}
