spring:
  profiles:
    default: dev
  application:
    name: catalog-service
  datasource:
    url: jdbc:h2:file:./catalog-db;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

acervo:
  security:
    jwt:
      secret: ${ACERVO_JWT_SECRET}
      issuer: acervo-identity